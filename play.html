<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Lottery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Pick Your Lottery Numbers</h1>
    </header>

    <main>
        <form id="lottery-form">
            <label>Select 6 Numbers (1-49):</label>
            <div class="numbers">
                <input type="number" min="1" max="49" required>
                <input type="number" min="1" max="49" required>
                <input type="number" min="1" max="49" required>
                <input type="number" min="1" max="49" required>
                <input type="number" min="1" max="49" required>
                <input type="number" min="1" max="49" required>
            </div>
            <button type="submit" class="btn">Buy Ticket</button>
            
            <button id="draw-btn" class="btn">Generate Winning Numbers</button>
        <p id="result"></p>
        </form>
    </main>

    <footer>
        <p></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
